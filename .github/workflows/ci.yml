name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
        env:
          PYO3_PYTHON: python
      - run: cargo test -p afterslides
      - run: cargo doc -p afterslides --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p afterslides --all-targets

  python-lint:
    name: Python (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx ruff@0.16.10 check
      - run: uvx ruff@0.16.10 format --check
      - run: uvx mypy --strict python/afterslides --ignore-missing-imports

  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Build and install
        shell: bash
        run: |
          uv venv --python "${{ matrix.python }}"
          uv pip install maturin pytest python-pptx openpyxl pillow
          uv run --no-sync maturin develop --release
      - name: Test
        run: uv run --no-sync pytest -m "not libreoffice" -v

  libreoffice:
    name: LibreOffice interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation
      - run: |
          uv venv --python 3.12
          uv pip install maturin pytest python-pptx openpyxl pillow
          uv run --no-sync maturin develop --release
      - run: uv run --no-sync pytest -m libreoffice -v
      - name: Rendering tests (with poppler and metric-compatible fonts)
        run: uv run --no-sync pytest tests/test_render.py -v

  corpus:
    name: Real-world corpus + Open XML SDK validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/cache@v6
        with:
          path: .corpus
          key: corpus-${{ hashFiles('scripts/fetch_corpus.sh') }}
      - run: scripts/fetch_corpus.sh
      - run: |
          uv venv --python 3.12
          uv pip install maturin pytest python-pptx openpyxl pillow
          uv run --no-sync maturin develop --release
      - name: Run all edits on all decks, keeping every result
        run: uv run --no-sync pytest -m "not slow and not libreoffice" -q
        env:
          AFTERSLIDES_DUMP_DIR: ${{ runner.temp }}/decks
      - name: Validate the results against their inputs
        run: uv run --no-sync python scripts/validate_outputs.py "${{ runner.temp }}/decks"
